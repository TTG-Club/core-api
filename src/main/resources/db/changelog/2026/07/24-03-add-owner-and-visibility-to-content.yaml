databaseChangeLog:
  # Раскатка homebrew-полей (owner_id + visibility) на остальные типы контента по образцу
  # заклинаний (см. 24-02). owner_id IS NULL — официальный контент. Каждая таблица — отдельный
  # changeSet, чтобы применялись/откатывались независимо.

  - changeSet:
      id: 2026-07-24-03-add-owner-and-visibility-to-species
      author: claude
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            tableName: species
            columns:
              - column:
                  name: owner_id
                  type: UUID
              - column:
                  name: visibility
                  type: VARCHAR(16)
        - createIndex:
            tableName: species
            indexName: species_owner_id_index
            columns:
              - column:
                  name: owner_id

  - changeSet:
