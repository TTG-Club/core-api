databaseChangeLog:
  - changeSet:
      id: 2026-09-24-04-create-player-bastion-facility-table
      author: Magistrus
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        # Сооружение персонажа в бастионе — экземпляр сооружения справочника bastion_facility.
        - createTable:
            tableName: player_bastion_facility
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_player_bastion_facility
              - column:
                  name: member_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_player_bastion_facility_member
                    references: player_bastion_member(id)
                    deleteCascade: true
              - column:
                  name: facility_url
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: space
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: prerequisite_confirmed
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: choices
                  type: JSONB
                  defaultValue: '[]'
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: updated_at
                  type: DATETIME
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: last_username
                  type: VARCHAR(255)
        - createIndex:
            tableName: player_bastion_facility
            indexName: player_bastion_facility_member_id_index
            columns:
              - column:
                  name: member_id
