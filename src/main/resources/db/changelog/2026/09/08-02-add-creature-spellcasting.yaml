databaseChangeLog:
  - changeSet:
      id: 2026-09-08-02-add-creature-spellcasting
      author: Peterko
      comment: >
        Заклинания существа блоками. До сих пор они жили только текстом записи действия, и
        на виртуальный стол не уезжало ничего: собственная вкладка заклинаний у существа
        оставалась пустой. Блок держит свою заклинательную характеристику, свою Сл и свои
        порции по ограничению применений — у одного существа их бывает несколько с разными
        характеристикой и Сл (зелёная карга: «Магия шабаша» от Интеллекта со Сл 11 и
        «Использование заклинаний» от Мудрости со Сл 12). Заводятся руками в мастерской,
        разбора описаний нет; на карточку сайта блоки не выводятся.
      changes:
        - addColumn:
            tableName: bestiary
            columns:
              - column:
                  name: spellcasting
                  type: jsonb
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: bestiary
            columnName: spellcasting
