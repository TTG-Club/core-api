databaseChangeLog:
  - changeSet:
      id: 2026-09-19-01-add-item-ammunition-type
      author: Peterko
      comment: >
        Тип боеприпаса у самого предмета («Боеприпас для»). У оружия «чем стреляет» лежит
        в weapon.ammo, а у стрел, болтов и пуль такого поля не было: выгрузка в VTTG не
        могла сказать, каким оружием стреляют этим боеприпасом, и выстрел на листе не
        находил патроны своего типа — лук приходилось заряжать руками.

        Существующие боеприпасы заполняются по названию: иглы → NEEDLE, стрелы → ARROW,
        болты → BOLT, снаряды и пули для пращи → SLING_BULLET, остальные пули → BULLET.
        Порядок правил важен: «иглы для духовой трубки» разбираются раньше любых пуль, а
        «пули для пращи» — раньше просто «пуль».

        Заполняются только предметы с типом AMMUNITION (item_types — jsonb-массив строк) и
        только те, у которых поле пусто: заданный руками тип перенос не трогает. Что не
        разобралось по названию, остаётся пустым — такие записи видно запросом:
        SELECT url, name FROM item
        WHERE jsonb_exists(item_types, 'AMMUNITION') AND ammunition_type IS NULL;

        Время изменения предмета не сдвигается: его показывает карточка на сайте.
        Предрассчитанный payload выгрузки пересчитывается подъёмом SCHEMA_VERSION.
      changes:
        - addColumn:
            tableName: item
            columns:
              - column:
                  name: ammunition_type
                  type: VARCHAR(255)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              SET search_path TO ttg, public;

              WITH resolved AS (
                  SELECT i.url,
                         CASE
                             WHEN lower(i.name) LIKE '%игл%' THEN 'NEEDLE'
                             WHEN lower(i.name) LIKE '%стрел%' THEN 'ARROW'
                             WHEN lower(i.name) LIKE '%болт%' THEN 'BOLT'
                             WHEN lower(i.name) LIKE '%пращ%' THEN 'SLING_BULLET'
                             WHEN lower(i.name) LIKE '%снаряд%' THEN 'SLING_BULLET'
                             WHEN lower(i.name) LIKE '%пул%' THEN 'BULLET'
                         END AS ammunition_type
                  FROM item i
                  WHERE i.ammunition_type IS NULL
                    AND jsonb_typeof(i.item_types) = 'array'
                    AND jsonb_exists(i.item_types, 'AMMUNITION')
              )
              UPDATE item target
              SET ammunition_type = resolved.ammunition_type
              FROM resolved
              WHERE target.url = resolved.url
                AND resolved.ammunition_type IS NOT NULL;
